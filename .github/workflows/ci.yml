name: Qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm questions:validate
      - run: pnpm questions:check
      - run: pnpm questions:simulate --check
      - run: pnpm avatars:check
      - run: pnpm build

  smoke:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm questions:check
      - run: pnpm build
      - run: pnpm --filter @penshow/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e:run
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: smoke-modalidades
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
